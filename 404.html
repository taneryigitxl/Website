<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0a">
  <title>Sayfa bulunamadı | Taner Yiğit</title>
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    @font-face { font-family: "Inter"; font-display: swap; font-weight: 100 900; src: url("/assets/fonts/inter-latin-wght-normal.woff2") format("woff2-variations"); unicode-range: U+0000-00FF, U+0131, U+2000-206F; }
    @font-face { font-family: "Inter"; font-display: swap; font-weight: 100 900; src: url("/assets/fonts/inter-latin-ext-wght-normal.woff2") format("woff2-variations"); unicode-range: U+0100-02AF; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; min-height: 100svh; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 40%, rgba(147,130,101,.16), transparent 32rem), #0a0a0a; color: #faf8f5; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 520px; }
    img { width: 64px; height: 64px; margin: 0 auto 28px; }
    .code { margin: 0; color: #ded6c8; font: 700 .78rem/1 ui-monospace, Consolas, monospace; letter-spacing: .24em; }
    h1 { margin: 14px 0 12px; font-size: clamp(2rem, 7vw, 3rem); font-weight: 650; letter-spacing: -.04em; line-height: 1.1; }
    p { margin: 0; color: #b1aea9; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 30px; }
    a { display: inline-flex; min-height: 46px; align-items: center; padding: 12px 18px; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; color: #e5e3e0; font-size: .86rem; font-weight: 700; text-decoration: none; }
    a.primary { border-color: transparent; background: #faf9f7; color: #1a1918; }
    a:hover { border-color: rgba(213,203,186,.4); }
    :focus-visible { outline: 2px solid #ded6c8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-mark.svg" alt="" width="64" height="64">
    <p class="code">404</p>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. <span lang="en">The page you are looking for could not be found.</span></p>
    <div class="actions">
      <a class="primary" href="/">Ana sayfaya dön</a>
      <a href="/en/index.html" lang="en">English homepage</a>
    </div>
  </main>
</body>
</html>
