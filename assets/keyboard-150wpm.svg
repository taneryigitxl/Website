<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" width="1600" height="1131">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a18"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#cfc4b1" stop-opacity=".2"/><stop offset="1" stop-color="#cfc4b1" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3eee5"/><stop offset=".45" stop-color="#cfc4b1"/><stop offset=".7" stop-color="#9c917f"/><stop offset="1" stop-color="#e4dccd"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2825"/><stop offset="1" stop-color="#171614"/></linearGradient>
    <linearGradient id="keyHot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e2d6"/><stop offset="1" stop-color="#a99d88"/></linearGradient>
    <symbol id="k" viewBox="0 0 80 80"><rect x="2" y="2" width="76" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/><rect x="10" y="8" width="60" height="56" rx="9" fill="#ffffff" fill-opacity=".03"/></symbol>
    <symbol id="kh" viewBox="0 0 80 80"><rect x="2" y="2" width="76" height="76" rx="12" fill="url(#keyHot)"/><rect x="10" y="8" width="60" height="56" rx="9" fill="#ffffff" fill-opacity=".18"/></symbol>
  </defs>
  <rect width="1600" height="1131" fill="url(#bg)"/>
  <rect width="1600" height="1131" fill="url(#glow)"/>

  <!-- score -->
  <text x="800" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="230" letter-spacing="-10" fill="url(#metal)">150</text>
  <text x="800" y="370" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="46" letter-spacing="18" fill="#cfc4b1">WPM</text>
  <g transform="translate(800 440)">
    <rect x="-180" y="-34" width="360" height="62" rx="31" fill="none" stroke="#cfc4b1" stroke-opacity=".6" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="28" letter-spacing="6" fill="#e9e2d6">TÜRKİYE · TOP 5</text>
  </g>

  <!-- keyboard -->
  <g transform="translate(170 540)">
    <rect x="0" y="0" width="1260" height="470" rx="40" fill="#121110" stroke="#cfc4b1" stroke-opacity=".35" stroke-width="3"/>
    <rect x="14" y="14" width="1232" height="442" rx="30" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="2"/>
    <!-- row 1 -->
    <g transform="translate(40 40)">
      <use href="#k" x="0" width="80" height="80"/><use href="#k" x="90" width="80" height="80"/><use href="#k" x="180" width="80" height="80"/><use href="#k" x="270" width="80" height="80"/><use href="#kh" x="360" width="80" height="80"/><use href="#k" x="450" width="80" height="80"/><use href="#k" x="540" width="80" height="80"/><use href="#k" x="630" width="80" height="80"/><use href="#k" x="720" width="80" height="80"/><use href="#k" x="810" width="80" height="80"/><use href="#k" x="900" width="80" height="80"/><use href="#k" x="990" width="80" height="80"/>
      <rect x="1082" y="2" width="96" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(40 135)">
      <rect x="2" y="2" width="116" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
      <use href="#k" x="130" width="80" height="80"/><use href="#k" x="220" width="80" height="80"/><use href="#kh" x="310" width="80" height="80"/><use href="#k" x="400" width="80" height="80"/><use href="#k" x="490" width="80" height="80"/><use href="#k" x="580" width="80" height="80"/><use href="#kh" x="670" width="80" height="80"/><use href="#k" x="760" width="80" height="80"/><use href="#k" x="850" width="80" height="80"/><use href="#k" x="940" width="80" height="80"/>
      <rect x="1032" y="2" width="146" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(40 230)">
      <rect x="2" y="2" width="146" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
      <use href="#k" x="160" width="80" height="80"/><use href="#kh" x="250" width="80" height="80"/><use href="#k" x="340" width="80" height="80"/><use href="#k" x="430" width="80" height="80"/><use href="#k" x="520" width="80" height="80"/><use href="#k" x="610" width="80" height="80"/><use href="#k" x="700" width="80" height="80"/><use href="#kh" x="790" width="80" height="80"/><use href="#k" x="880" width="80" height="80"/>
      <rect x="972" y="2" width="206" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
    </g>
    <!-- space row -->
    <g transform="translate(40 325)">
      <rect x="2" y="2" width="116" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
      <rect x="132" y="2" width="96" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
      <rect x="242" y="2" width="696" height="76" rx="12" fill="url(#keyHot)"/>
      <rect x="952" y="2" width="96" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
      <rect x="1062" y="2" width="116" height="76" rx="12" fill="url(#key)" stroke="#3a3733" stroke-width="2"/>
    </g>
  </g>
</svg>
