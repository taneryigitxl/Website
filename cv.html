  <title>Taner Yiğit | Özgeçmiş (CV)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #09070f; color: #f7f4fb; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: 66px minmax(0, 1fr); overflow: hidden; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 9px clamp(14px, 3vw, 34px); border-bottom: 1px solid rgba(255,255,255,.09); background: rgba(11,8,17,.95); }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-size: .84rem; font-weight: 700; }
    .brand img { width: 42px; height: 42px; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .actions a { padding: 9px 13px; border: 1px solid rgba(255,255,255,.11); border-radius: 10px; color: #bbb2c8; text-decoration: none; font-size: .72rem; font-weight: 700; }
    .actions a:last-child { border-color: rgba(175,127,255,.28); background: rgba(143,89,239,.12); color: #ddcaff; }
    .actions a:hover { border-color: rgba(190,151,255,.45); color: #fff; }
    .cv-viewer { display: block; width: 100%; height: 100%; border: 0; }
    .pdf-fallback { display: grid; min-height: 100%; place-items: center; padding: 24px; color: #aaa2b8; text-align: center; }
    .pdf-fallback a { color: #c5a7ff; }
    :focus-visible { outline: 2px solid #c5a7ff; outline-offset: 3px; }
    @media (max-width: 540px) { .brand span { display: none; } .actions a:first-child { display: none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="index.html"><img src="assets/taner-yigit-mark.svg" alt="" width="42" height="42"><span>Taner Yiğit · Özgeçmiş</span></a>
    <nav class="actions" aria-label="Özgeçmiş işlemleri"><a href="index.html">← Ana sayfaya dön</a><a href="assets/taner-yigit-cv.pdf" target="_blank" rel="noopener noreferrer">PDF'yi aç ↗</a></nav>
  </header>
  <object class="cv-viewer" data="assets/taner-yigit-cv.pdf#view=FitH&amp;navpanes=0" type="application/pdf" aria-label="Taner Yiğit özgeçmişi">
    <div class="pdf-fallback"><p>Tarayıcınız PDF önizlemesini desteklemiyor. <a href="assets/taner-yigit-cv.pdf" target="_blank" rel="noopener noreferrer">Özgeçmiş PDF dosyasını açın.</a></p></div>
  </object>
</body>
